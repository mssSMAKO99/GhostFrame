name: Build GhostFrame

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File build.ps1 -Configuration Release

      - name: Agent harness (deterministic)
        shell: pwsh
        run: |
          .\build\out\x64\Release\GfAgentHost.exe (Resolve-Path .\build\payload\Release\GhostFrameAgent64.dll).Path
          if ($LASTEXITCODE -ne 0) { throw "agent harness failed with $LASTEXITCODE" }

      # Full end-to-end injection test.  Cross-process hooks are blocked on some
      # hardened CI images, so this step is informative rather than gating.
      - name: Injection smoke test
        continue-on-error: true
        shell: pwsh
        run: |
          $target = Start-Process .\build\out\x64\Release\GfTestTarget.exe -PassThru `
              -RedirectStandardOutput "$env:TEMP\target.out" `
              -RedirectStandardError "$env:TEMP\target.err"
          Start-Sleep -Seconds 1
          $self = Start-Process .\build\out\x64\Release\GhostFrame.exe -ArgumentList '--selftest' `
              -Wait -PassThru `
              -RedirectStandardOutput "$env:TEMP\selftest.out" `
              -RedirectStandardError "$env:TEMP\selftest.err"
          $code = $self.ExitCode
          Stop-Process -Id $target.Id -Force -ErrorAction SilentlyContinue
          if (Test-Path "$env:TEMP\GhostFrame.selftest.log") {
            Get-Content "$env:TEMP\GhostFrame.selftest.log"
          }
          if (Test-Path "$env:TEMP\GhostFrame\ghostframe.log") {
            Get-Content "$env:TEMP\GhostFrame\ghostframe.log"
          }
          exit $code

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: GhostFrame-x64
          path: dist/GhostFrame.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/GhostFrame.exe
          generate_release_notes: true
