name: Build GhostFrame Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build x86 Payloads (HideHook32 & Helper32)
        run: |
          msbuild HideHook/HideHook.vcxproj /p:Configuration=Release /p:Platform=Win32 /p:TargetName=HideHook32 /p:SolutionDir="${{ github.workspace }}\" /p:OutDir="${{ github.workspace }}\HookLauncher64\\"
          msbuild Helper32/Helper32.vcxproj /p:Configuration=Release /p:Platform=Win32 /p:TargetName=Helper32 /p:SolutionDir="${{ github.workspace }}\" /p:OutDir="${{ github.workspace }}\HookLauncher64\\"

      - name: Build x64 Payload (HideHook64)
        run: |
          msbuild HideHook/HideHook.vcxproj /p:Configuration=Release /p:Platform=x64 /p:TargetName=HideHook64 /p:SolutionDir="${{ github.workspace }}\" /p:OutDir="${{ github.workspace }}\HookLauncher64\\"

      - name: Build Standalone HookLauncher64.exe
        run: |
          msbuild HookLauncher64/HookLauncher64.vcxproj /p:Configuration=Release /p:Platform=x64 /p:SolutionDir="${{ github.workspace }}\" /p:OutDir="${{ github.workspace }}\dist\\"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GhostFrame-Standalone-x64
          path: dist/HookLauncher64.exe
