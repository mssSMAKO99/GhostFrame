name: Build & Release GhostFrame

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Build x86 Payloads (HideHook32 & Helper32)
        run: |
          msbuild HideHook/HideHook.vcxproj /p:Configuration=Release /p:Platform=Win32 /p:TargetName=HideHook32 /p:SolutionDir="${{ github.workspace }}\"
          msbuild Helper32/Helper32.vcxproj /p:Configuration=Release /p:Platform=Win32 /p:TargetName=Helper32 /p:SolutionDir="${{ github.workspace }}\"

      - name: Build x64 Payload (HideHook64)
        run: |
          msbuild HideHook/HideHook.vcxproj /p:Configuration=Release /p:Platform=x64 /p:TargetName=HideHook64 /p:SolutionDir="${{ github.workspace }}\"

      - name: Build Standalone HookLauncher64.exe
        run: |
          msbuild HookLauncher64/HookLauncher64.vcxproj /p:Configuration=Release /p:Platform=x64 /p:SolutionDir="${{ github.workspace }}\" /p:OutDir="${{ github.workspace }}\dist\\"
          ren dist\HookLauncher64.exe GhostFrame.exe

      - name: Upload Artifact
        uses: actions/upload-artifact@v5
        with:
          name: GhostFrame-Standalone-x64
          path: dist/GhostFrame.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/GhostFrame.exe
          generate_release_notes: true
